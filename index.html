<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 數學小測驗</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d1117;--card:#161b22;--card2:#1c2128;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--purple:#bc8cff;--text:#e6edf3;--muted:#8b949e;--border:#30363d}
    body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 80px}
    header{text-align:center;margin:20px 0 36px}
    .logo{font-size:3.5rem;display:block;margin-bottom:10px}
    h1{font-size:2rem;font-weight:900;margin-bottom:6px}
    .subtitle{color:var(--muted);font-size:.9rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:700px;margin-bottom:18px}
    .section-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:14px}
    .school-block{margin-bottom:16px}
    .school-name{font-size:.82rem;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .school-name::before{content:'';flex:none;width:3px;height:12px;border-radius:2px;background:var(--blue)}
    .school-name.jh::before{background:var(--green)}
    .school-name.hs::before{background:var(--purple)}
    .grade-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
    @media(max-width:480px){.grade-grid{grid-template-columns:repeat(3,1fr)}}
    .grade-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 4px;color:var(--muted);font-size:.88rem;font-family:inherit;cursor:pointer;transition:all .18s;text-align:center}
    .grade-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.08)}
    .grade-btn.active{font-weight:700}
    .grade-btn[data-school="es"].active{border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.15)}
    .grade-btn[data-school="jh"].active{border-color:var(--green);color:var(--green);background:rgba(63,185,80,.15)}
    .grade-btn[data-school="hs"].active{border-color:var(--purple);color:var(--purple);background:rgba(188,140,255,.15)}
    .settings-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
    .setting-item{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}
    .setting-item label{color:var(--muted);font-size:.88rem;white-space:nowrap}
    select{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:.88rem;font-family:inherit;cursor:pointer;outline:none;flex:1}
    select:focus{border-color:var(--blue)}
    .start-btn{width:100%;padding:15px;background:linear-gradient(135deg,#58a6ff,#1f6feb);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .15s,opacity .15s;margin-top:18px}
    .start-btn:hover{transform:translateY(-2px);opacity:.92}
    .start-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .stat-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
    .stat-num{font-size:1.8rem;font-weight:900;color:var(--blue);margin-bottom:3px}
    .stat-num.g{color:var(--green)}.stat-num.p{color:var(--purple)}
    .stat-lbl{font-size:.72rem;color:var(--muted)}
    /* FAB */
    .fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:all .2s;z-index:100}
    .fab:hover{border-color:var(--blue);color:var(--blue)}
    .fab.set{border-color:var(--green);color:var(--green)}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
    .overlay.open{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:480px;margin:16px}
    .modal h2{font-size:1.2rem;margin-bottom:6px}
    .modal p{color:var(--muted);font-size:.85rem;margin-bottom:18px;line-height:1.6}
    .modal input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:10px;font-size:.9rem;font-family:inherit;outline:none;margin-bottom:12px}
    .modal input:focus{border-color:var(--blue)}
    .modal-btns{display:flex;gap:10px}
    .btn-save{flex:1;padding:12px;background:linear-gradient(135deg,#3fb950,#238636);color:#fff;border:none;border-radius:10px;font-weight:700;font-family:inherit;cursor:pointer}
    .btn-cancel{padding:12px 20px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:10px;font-family:inherit;cursor:pointer}
    .api-status{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:14px;padding:10px 14px;border-radius:8px;background:var(--card2)}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .dot.set{background:var(--green)}
    .groq-link{color:var(--blue);text-decoration:none}
    .groq-link:hover{text-decoration:underline}
    .model-select-label{font-size:.82rem;color:var(--muted);margin:12px 0 6px;display:block}
    footer{color:var(--muted);font-size:.75rem;margin-top:auto;text-align:center;padding-top:28px}
  </style>
</head>
<body>
<header>
  <span class="logo">🧮</span>
  <h1>AI 數學小測驗</h1>
  <p class="subtitle">小一至高三 · Groq AI 即時陪伴 · Firebase 記錄成績</p>
</header>

<div class="card">
  <div class="section-label">選擇年級</div>
  <div class="school-block">
    <div class="school-name">國小</div>
    <div class="grade-grid">
      <button class="grade-btn" data-grade="1" data-school="es" data-label="小一">小一</button>
      <button class="grade-btn" data-grade="2" data-school="es" data-label="小二">小二</button>
      <button class="grade-btn" data-grade="3" data-school="es" data-label="小三">小三</button>
      <button class="grade-btn" data-grade="4" data-school="es" data-label="小四">小四</button>
      <button class="grade-btn" data-grade="5" data-school="es" data-label="小五">小五</button>
      <button class="grade-btn" data-grade="6" data-school="es" data-label="小六">小六</button>
    </div>
  </div>
  <div class="school-block">
    <div class="school-name jh">國中</div>
    <div class="grade-grid">
      <button class="grade-btn" data-grade="7" data-school="jh" data-label="國一">國一</button>
      <button class="grade-btn" data-grade="8" data-school="jh" data-label="國二">國二</button>
      <button class="grade-btn" data-grade="9" data-school="jh" data-label="國三">國三</button>
    </div>
  </div>
  <div class="school-block">
    <div class="school-name hs">高中</div>
    <div class="grade-grid">
      <button class="grade-btn" data-grade="10" data-school="hs" data-label="高一">高一</button>
      <button class="grade-btn" data-grade="11" data-school="hs" data-label="高二">高二</button>
      <button class="grade-btn" data-grade="12" data-school="hs" data-label="高三">高三</button>
    </div>
  </div>
  <div class="settings-row">
    <div class="setting-item">
      <label>題目數量</label>
      <select id="qtySelect">
        <option value="5">5 題</option>
        <option value="10" selected>10 題</option>
        <option value="15">15 題</option>
        <option value="20">20 題</option>
      </select>
    </div>
    <div class="setting-item">
      <label>AI 模型</label>
      <select id="modelSelect">
        <option value="openai/gpt-oss-120b" selected>GPT-OSS 120B（強大）</option>
        <option value="openai/gpt-oss-20b">GPT-OSS 20B（快速）</option>
      </select>
    </div>
  </div>
  <button class="start-btn" id="startBtn" disabled onclick="startQuiz()">請先選擇年級</button>
</div>

<div class="card">
  <div class="section-label">📊 歷史統計</div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num" id="sTotal">—</div><div class="stat-lbl">總測驗次數</div></div>
    <div class="stat-box"><div class="stat-num g" id="sQuestions">—</div><div class="stat-lbl">總作答題數</div></div>
    <div class="stat-box"><div class="stat-num p" id="sAvg">—</div><div class="stat-lbl">平均正確率</div></div>
  </div>
</div>

<footer>Powered by Groq AI · Firebase · © 2024 AI 數學測驗系統</footer>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="openModal()" title="設定 Groq API Key">⚙️</button>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeOnBg(event)">
  <div class="modal">
    <h2>⚙️ API Key 設定</h2>
    <p>輸入您的 <strong><a class="groq-link" href="https://console.groq.com/keys" target="_blank">Groq API Key</a></strong>（格式：gsk_...），即可使用 GPT-OSS 120B / 20B 等模型。<br><br>Key 只儲存在您的瀏覽器 localStorage，不會傳送至任何伺服器。</p>
    <div class="api-status">
      <div class="dot" id="apiDot"></div>
      <span id="apiStatusTxt">尚未設定</span>
    </div>
    <input type="password" id="keyInput" placeholder="gsk_..." autocomplete="off">
    <label class="model-select-label">AI 模型</label>
    <select id="modalModelSelect" style="width:100%;margin-bottom:14px">
      <option value="openai/gpt-oss-120b" selected>GPT-OSS 120B（MoE 大模型）</option>
      <option value="openai/gpt-oss-20b">GPT-OSS 20B（MoE 中型模型）</option>
    </select>
    <div id="testResult" style="display:none;margin-bottom:12px;padding:10px 14px;border-radius:8px;font-size:.82rem"></div>
    <div class="modal-btns">
      <button class="btn-save" id="saveKeyBtn" onclick="saveKey()">儲存並測試連線</button>
      <button class="btn-cancel" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBfmiNqfe_HmH9AHY9Uo2Ngvq49AulM6EE",authDomain:"test-53f48.firebaseapp.com",projectId:"test-53f48",storageBucket:"test-53f48.firebasestorage.app",messagingSenderId:"261734973548",appId:"1:261734973548:web:66b955eb80c60ad9381849"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let selectedGrade=null;
document.querySelectorAll('.grade-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.grade-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedGrade={grade:btn.dataset.grade,label:btn.dataset.label};
    const sb=document.getElementById('startBtn');
    sb.disabled=false;sb.textContent=`開始 ${btn.dataset.label} 測驗 →`;
  });
});
window.startQuiz=function(){
  if(!selectedGrade)return;
  const qty=document.getElementById('qtySelect').value;
  const model=document.getElementById('modelSelect').value;
  location.href=`quiz.html?grade=${selectedGrade.grade}&label=${encodeURIComponent(selectedGrade.label)}&qty=${qty}&model=${encodeURIComponent(model)}`;
};
function updateApiStatus(){
  const k=localStorage.getItem('groq_api_key');
  const dot=document.getElementById('apiDot');const txt=document.getElementById('apiStatusTxt');const fab=document.getElementById('fabBtn');
  if(k&&k.startsWith('gsk_')){dot.className='dot set';txt.textContent='API Key 已設定 ✓';fab.className='fab set';}
  else{dot.className='dot';txt.textContent='尚未設定 API Key';fab.className='fab';}
}
window.openModal=function(){
  const k=localStorage.getItem('groq_api_key')||'';
  document.getElementById('keyInput').value=k;
  document.getElementById('overlay').classList.add('open');
  updateApiStatus();
};
window.closeModal=function(){document.getElementById('overlay').classList.remove('open');};
window.closeOnBg=function(e){if(e.target===document.getElementById('overlay'))closeModal();};
window.saveKey=async function(){
  const v=document.getElementById('keyInput').value.trim();
  const btn=document.getElementById('saveKeyBtn');
  const resultDiv=document.getElementById('testResult');
  if(v){
    localStorage.setItem('groq_api_key',v);
    btn.disabled=true;btn.textContent='測試中...';
    resultDiv.style.display='block';
    resultDiv.style.background='rgba(88,166,255,.08)';resultDiv.style.border='1px solid rgba(88,166,255,.2)';
    resultDiv.style.color='var(--blue)';resultDiv.textContent='⏳ 正在測試連線...';
    try{
      const model=document.getElementById('modalModelSelect').value;
      const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+v},
        body:JSON.stringify({model:model,messages:[{role:'user',content:'reply OK'}],max_tokens:5})
      });
      const data=await res.json();
      if(data.error){throw new Error(data.error.message);}
      resultDiv.style.background='rgba(63,185,80,.1)';resultDiv.style.border='1px solid rgba(63,185,80,.3)';
      resultDiv.style.color='var(--green)';resultDiv.textContent='✅ 連線成功！模型：'+model;
      updateApiStatus();
      setTimeout(closeModal,1500);
    }catch(e){
      resultDiv.style.background='rgba(248,81,73,.08)';resultDiv.style.border='1px solid rgba(248,81,73,.2)';
      resultDiv.style.color='var(--red)';resultDiv.textContent='❌ 連線失敗：'+e.message;
    }finally{btn.disabled=false;btn.textContent='儲存並測試連線';}
  }else{
    localStorage.removeItem('groq_api_key');
    updateApiStatus();closeModal();
  }
};
updateApiStatus();
async function loadStats(){
  try{
    const snap=await getDocs(collection(db,'quiz_results'));
    const docs=snap.docs.map(d=>d.data());
    document.getElementById('sTotal').textContent=docs.length||0;
    const tq=docs.reduce((s,d)=>s+(d.totalQuestions||0),0);
    document.getElementById('sQuestions').textContent=tq;
    if(docs.length>0){const avg=docs.reduce((s,d)=>s+(d.accuracy||0),0)/docs.length;document.getElementById('sAvg').textContent=Math.round(avg)+'%';}
    else document.getElementById('sAvg').textContent='—';
  }catch(e){console.log('stats',e);}
}
loadStats();
</script>
</body>
</html>
